<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro Super Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Preencha seus dados para continuar</h2>
    <form id="badForm">
      <label>Nome Completo:</label>
      <input type="text" id="nome" placeholder="Digite..." required>

      <label>Senha Secreta:</label>
      <input type="password" id="senha" placeholder="Digite a senha" required>
      <small id="senhaDica">A senha deve ter um número par e exatamente 1 emoji.</small>

      <div class="buttons">
        <button type="button" id="btnAvancar" class="btn-secundario">Avançar</button>
        <button type="reset" id="btnCancelar" class="btn-primario">CANCELAR TUDO</button>
      </div>
    </form>
    <div id="mensagem" class="hidden"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
