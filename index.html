<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro dos Otários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Preencha aí se for capaz... 🤡</h2>
    
    <form id="badForm">
      <label for="nome">Nome do iludido:</label>
      <input type="text" id="nome" placeholder="Coloca teu nome aqui, mané">

      <label for="senha">Senha secreta (se você souber criar):</label>
      <input type="password" id="senha" placeholder="Digita qualquer besteira">

      <small id="senhaDica">Dica: Se errar, nem adianta chorar no suporte.</small>

      <!-- O botão verde na verdade zera tudo -->
      <button id="btnCancelar" class="btn-cancelar">CONFIRMAR E AVANÇAR</button>

      <!-- A mensagem de deboche -->
      <div id="mensagem" class="sucesso-falso hidden"></div>

      <!-- O botão real escondido -->
      <div class="rodape-escondido">
        <a href="#" id="btnAvancar">Cancelar operação</a>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
